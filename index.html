<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PremTube Player</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #app, #player {
        width: 100%;
        height: 100%;
        min-width: 200px;
        min-height: 200px;
        margin: 0;
        background: #111;
      }
      body {
        overflow: hidden;
        color: #ddd;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #results {
        display: none;
        width: 100%;
        height: 100%;
        padding: 12px;
        overflow-y: auto;
        background: #1e1e1e;
      }
      #results.is-visible { display: grid; }
      #results {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        align-content: start;
        gap: 12px;
      }
      .result {
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: #292929;
        color: #ddd;
        cursor: pointer;
        overflow: hidden;
        text-align: left;
      }
      .result:hover { background: #353535; }
      .result img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
      }
      .result span {
        display: block;
        padding: 9px 10px 11px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.35;
      }
      .empty {
        grid-column: 1 / -1;
        padding: 40px 12px;
        color: #888;
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="player" aria-label="YouTube-speler"></div>
      <section id="results" aria-label="YouTube-zoekresultaten"></section>
    </main>
    <script>
      (() => {
        "use strict";

        const apiKey = "__YOUTUBE_API_KEY__";
        const results = document.getElementById("results");
        let player = null;
        let pendingVideoId = null;

        function send(type, detail) {
          window.uxpHost?.postMessage({
            source: "premtube-player",
            type,
            detail
          });
        }

        function playerElement() {
          return player?.getIframe?.() || document.getElementById("player");
        }

        function showPlayer() {
          results.classList.remove("is-visible");
          const element = playerElement();
          if (element) element.style.display = "block";
        }

        function showResults() {
          const element = playerElement();
          if (element) element.style.display = "none";
          results.classList.add("is-visible");
        }

        function load(videoId) {
          if (!/^[\w-]{11}$/.test(videoId)) {
            send("error", "Ongeldige video-ID");
            return;
          }

          showPlayer();
          if (player && typeof player.loadVideoById === "function") {
            player.loadVideoById(videoId);
          } else {
            pendingVideoId = videoId;
          }
        }

        function renderResults(items) {
          results.textContent = "";

          if (!items.length) {
            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "Geen video's gevonden";
            results.appendChild(empty);
            showResults();
            return;
          }

          for (const item of items) {
            const videoId = item.id?.videoId;
            if (!/^[\w-]{11}$/.test(videoId || "")) continue;

            const card = document.createElement("button");
            card.className = "result";
            card.type = "button";

            const image = document.createElement("img");
            image.src = item.snippet?.thumbnails?.medium?.url || "";
            image.alt = "";
            image.loading = "lazy";

            const title = document.createElement("span");
            title.textContent = item.snippet?.title || "YouTube-video";

            card.append(image, title);
            card.addEventListener("click", () => load(videoId));
            results.appendChild(card);
          }

          showResults();
        }

        async function search(query) {
          const normalizedQuery = String(query || "").trim();
          if (!normalizedQuery) {
            send("error", "Vul een zoekterm in");
            return;
          }

          results.textContent = "";
          const loading = document.createElement("p");
          loading.className = "empty";
          loading.textContent = "Zoeken…";
          results.appendChild(loading);
          showResults();

          try {
            const parameters = new URLSearchParams({
              part: "snippet",
              type: "video",
              videoEmbeddable: "true",
              maxResults: "12",
              q: normalizedQuery,
              key: apiKey
            });
            const response = await fetch(
              `https://www.googleapis.com/youtube/v3/search?${parameters}`
            );
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error?.message || `HTTP ${response.status}`);
            }
            renderResults(Array.isArray(data.items) ? data.items : []);
            send("searchResults");
          } catch (error) {
            results.textContent = "";
            const message = document.createElement("p");
            message.className = "empty";
            message.textContent = "Zoeken is niet gelukt";
            results.appendChild(message);
            showResults();
            send("error", error instanceof Error ? error.message : "Zoeken is niet gelukt");
          }
        }

        window.addEventListener("message", (event) => {
          if (event.data?.type === "load") load(event.data.videoId);
          if (event.data?.type === "search") search(event.data.query);
        });

        window.onYouTubeIframeAPIReady = () => {
          player = new YT.Player("player", {
            width: "100%",
            height: "100%",
            playerVars: {
              autoplay: 0,
              controls: 1,
              playsinline: 1,
              rel: 0
            },
            events: {
              onReady: () => {
                send("ready");
                if (pendingVideoId) {
                  player.loadVideoById(pendingVideoId);
                  pendingVideoId = null;
                }
              },
              onStateChange: (event) => {
                if (event.data === YT.PlayerState.PLAYING) send("playing");
                if (event.data === YT.PlayerState.PAUSED) send("paused");
              },
              onError: (event) => send("error", `YouTube-fout ${event.data}`)
            }
          });
        };

        const script = document.createElement("script");
        script.src = "https://www.youtube.com/iframe_api";
        script.async = true;
        script.onerror = () => send("error", "YouTube API kon niet worden geladen");
        document.head.appendChild(script);
      })();
    </script>
  </body>
</html>
